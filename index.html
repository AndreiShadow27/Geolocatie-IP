 <!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Geolocatie IP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <main class="card" role="main">
      <h1>
        <svg class="icon-geo" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z" />
        </svg>
        Geolocatie IP
      </h1>
      <p class="lead">Afișează adresa IP și locația geografică curentă.</p>

      <table aria-label="Informații IP">
        <tr>
          <th>IP (query)</th>
          <td id="ip" class="value">—</td>
        </tr>
        <tr>
          <th>Țară</th>
          <td id="country">—</td>
        </tr>
        <tr>
          <th>Oraș</th>
          <td id="city">—</td>
        </tr>
        <tr>
          <th>Latitudine / Longitudine</th>
          <td id="latlon">—</td>
        </tr>
      </table>
      
      <details id="allData" style="margin-top:14px">
        <summary style="cursor:pointer">Toate câmpurile returnate (detalii)</summary>
        <div style="margin-top:8px">
          <table class="all-fields" style="width:100%;border-collapse:collapse;margin-top:8px">
            <tbody id="allDataRows"></tbody>
          </table>
          <pre id="rawData" class="muted" style="white-space:pre-wrap;padding:12px;background:rgba(0,0,0,0.03);border-radius:8px;margin-top:8px">—</pre>
        </div>
      </details>
      <div class="controls">
        <button id="refreshBtn">Refresh IP</button>
        <button id="copyBtn" class="secondary">Copiază IP</button>
        <div id="status" class="muted">&nbsp;</div>
      </div>

      <p class="note">Date preluate de la <a href="https://ip-api.com/" target="_blank" rel="noopener">ip-api.com</a>. Apasă <strong>Refresh IP</strong> pentru actualizare.</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
